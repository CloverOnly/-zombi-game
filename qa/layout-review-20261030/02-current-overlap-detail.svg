<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1110" viewBox="0 0 1700 1110"><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#dc5052" stroke-width="2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#34445a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Malgun Gothic, 맑은 고딕, sans-serif" fill="#243145"><text x="60" y="64" font-size="36" font-weight="700">포유하우스 · 옆 건물 상가 배치도</text><text x="60" y="103" font-size="20" >실내 복도 투영 표시 제거 · 네이버 거리뷰 2025년 3월 화면을 기준으로 상가 순서 반영</text><rect x="140" y="190" width="900" height="750" fill="#fafbf9" stroke="#c9ced4" /><line x1="215" y1="190" x2="215" y2="940" stroke="#e6e9ed"  stroke-width="1"/><text x="215" y="178" font-size="17" text-anchor="middle">10</text><line x1="365" y1="190" x2="365" y2="940" stroke="#e6e9ed"  stroke-width="1"/><text x="365" y="178" font-size="17" text-anchor="middle">20</text><line x1="515" y1="190" x2="515" y2="940" stroke="#e6e9ed"  stroke-width="1"/><text x="515" y="178" font-size="17" text-anchor="middle">30</text><line x1="665" y1="190" x2="665" y2="940" stroke="#e6e9ed"  stroke-width="1"/><text x="665" y="178" font-size="17" text-anchor="middle">40</text><line x1="815" y1="190" x2="815" y2="940" stroke="#e6e9ed"  stroke-width="1"/><text x="815" y="178" font-size="17" text-anchor="middle">50</text><line x1="965" y1="190" x2="965" y2="940" stroke="#e6e9ed"  stroke-width="1"/><text x="965" y="178" font-size="17" text-anchor="middle">60</text><line x1="140" y1="190" x2="1040" y2="190" stroke="#e6e9ed"  stroke-width="1"/><text x="128" y="196" font-size="17" text-anchor="end">-10</text><line x1="140" y1="340" x2="1040" y2="340" stroke="#e6e9ed"  stroke-width="1"/><text x="128" y="346" font-size="17" text-anchor="end">0</text><line x1="140" y1="490" x2="1040" y2="4