" y="494.5" font-size="16" text-anchor="middle" font-weight="700">명륜진사갈비</text><line x1="365" y1="440.5" x2="800" y2="440.5" stroke="#34445a" stroke-width="2" marker-end="url(#arrow)"/><text x="590" y="422.5" font-size="18" text-anchor="middle">포유하우스 쪽 코너에서부터</text><path d="M346.54999999999995 467.5V572.5 M365 463.9H485" stroke="#b14439" stroke-width="7"/><circle cx="305" cy="712" r="15" fill="#2f806e" stroke="#fff" stroke-width="2"/><text x="305" y="718" font-size="17" text-anchor="middle" fill="#fff" font-weight="700">1</text><circle cx="848" cy="712.75" r="15" fill="#8a6e9b" stroke="#fff" stroke-width="2"/><text x="848" y="718.75" font-size="17" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="222.5" y="790" font-size="18" text-anchor="middle">게임 보행현관 ①</text><line x1="260" y1="775" x2="305" y2="722.5" stroke="#34445a" stroke-width="2" /><text x="875" y="790" font-size="18" text-anchor="middle">외벽 표시 ③</text><line x1="875" y1="775" x2="848" y2="725.5" stroke="#34445a" stroke-width="2" /><text x="710" y="340" font-size="21" text-anchor="middle">상가 골목</text><text x="965" y="565" font-size="21" text-anchor="middle" transform="rotate(90 965 565)">주차장 앞 도로</text><text x="1100" y="205" font-size="24" font-weight="700">표시 정리</text><text x="1100" y="239" font-size="20" >실내 복도의 투영과 빗금 제거</text><text x="1100" y="273" font-size="20" >건물과 도로 배치는 유지</text><text x="1100" y="327" font-size="24" font-weight="700">확인한 상가 순서</text><text x="1100" y="361" font-size="20" >풍전돈까스 → 보문산 식후경</text><text x="1100" y="395" font-size="20" >→ 명륜진사갈비</text><text x="1100" y="429" font-size="20" >코너에서 골목 교차로 쪽으로</text><text x="1100" y="483" font-size="24" font-weight="700">빨간 선</text><text x="1100" y="517" font-size="20" >풍전의 본 간판과 측면 간판</text><text x="1100" y="571" font-size="24" font-weight="700">게임 출입구</text><text x="1100" y="605" font-size="20" >① 보행현관 기능 위치</text><text x="1100" y="639" font-size="20" >③ 포유하우스 외벽 표지 위치</text><text x="60" y="1020" font-size="22" >풍전돈까스·보문산 식후경·명륜진사갈비의 간판과 매장 구간을 나누어 반영했습니다.</text><text x="60" y="1060" font-size="20" >실제 치수·실제 방위를 측량한 도면은 아닙니다. 기존 게임 좌표의 배치를 보여 줍니다.</text></g></svg>