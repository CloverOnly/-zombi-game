출입구와 사진 기준</text><text x="1110" y="640" font-size="20" >① 게임의 보행현관</text><text x="1110" y="675" font-size="20" >② 차량 출입구 · 차단기</text><text x="1110" y="710" font-size="20" >③ 외벽의 포유하우스 표시</text><text x="1110" y="745" font-size="20" >   (①과 별도 위치에 있습니다)</text><text x="1110" y="780" font-size="20" >● 사진 시점: 왼쪽을 바라봄</text><text x="1110" y="840" font-size="24" font-weight="700">거리뷰의 상가 순서</text><text x="1110" y="874" font-size="20" >풍전 → 보문산 식후경 → 명륜</text><text x="1110" y="906" font-size="20" >포유하우스 쪽 코너에서부터</text><text x="1110" y="966" font-size="22" font-weight="700">메모</text><line x1="1110" y1="1018" x2="1630" y2="1018" stroke="#d7dce1" stroke-width="2" /><line x1="1110" y1="1070" x2="1630" y2="1070" stroke="#d7dce1" stroke-width="2" /><line x1="1110" y1="1122" x2="1630" y2="1122" stroke="#d7dce1" stroke-width="2" /><line x1="1110" y1="1174" x2="1630" y2="1174" stroke="#d7dce1" stroke-width="2" /><line x1="1110" y1="1226" x2="1630" y2="1226" stroke="#d7dce1" stroke-width="2" /><text x="60" y="1420" font-size="23" >실내 복도의 보라색 투영 표시와 겹침 빗금을 제거했습니다. 건물 배치는 유지했습니다.</text><text x="60" y="1460" font-size="19" >치수는 코드의 설정값입니다. 대지 경계·실측 치수·실제 방위는 확인되지 않았습니다.</text></g></svg>